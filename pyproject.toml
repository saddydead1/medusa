[project]
name = "medusa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cbor2>=6.2.1",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
medusa-panel = "src.panel.cli:main"
medusa-node = "src.node.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/panel/static" = "src/panel/static"

[tool.fastapi]
entrypoint = "src.panel.main:app"
