name: Релиз

# Merge в main = релиз: версия берётся из pyproject.toml, образы едут в свой контейнерный
# реестр (docker.sonoma.su), на этом же коммите появляется тег v<версия> и релиз GitHub.
#
# Settings → Secrets and variables → Actions
#   SECRETS:   REGISTRY_PASSWORD — пароль для docker login в реестре
#   VARIABLES: REGISTRY_USERNAME   — логин в реестре (workflow примет и секрет с таким именем)
#              REGISTRY            — адрес реестра, по умолчанию docker.sonoma.su
#              REGISTRY_NAMESPACE  — путь внутри реестра: docker.sonoma.su/<namespace>/panel
#
# Все обращения к secrets и vars живут внутри шагов, а не в workflow-level env: там эти
# контексты разрешены гарантированно.
on:
  push:
    # develop здесь не ради релиза, а ради честного статуса: GitHub заводит прогон и на пуш
    # в develop, и без ветки в фильтре тот прогон заканчивается «failure» без единого джоба.
    # На develop джоб version не проходит свою if, а остальные нужны version — цепочка
    # пропускается целиком.
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write          # завести тег и релиз

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # два релиза одновременно publish-ить не должно

jobs:
  version:
    name: Версия из pyproject.toml
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        run: |
          set -euo pipefail
          v=$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)
          [ -n "$v" ] || { echo "в pyproject.toml нет версии" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"    >> "$GITHUB_OUTPUT"
          # этот релиз уже выпущен? (повторный merge без новой версии не должен плодить пустые релизы)
          if git ls-remote --tags origin "refs/tags/v$v" | grep -q "refs/tags/v$v"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "версия релиза: $v" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: ${{ matrix.image }} в реестре
    needs: version
    runs-on: ubuntu-latest
    env:
      # Xray внутри образа ноды: тот же пин, что и ARG по умолчанию в Dockerfile.node
      # (панель проверялась живым прогоном на 26.9.x, `latest` однажды приносит версию,
      # с которой рукопожатия расходятся)
      XRAY_IMAGE: ghcr.io/xtls/xray-core:26.9.9
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: panel
            dockerfile: deploy/Dockerfile.panel
          - image: node
            dockerfile: deploy/Dockerfile.node
    steps:
      - uses: actions/checkout@v7

      # «Password required» ничего не объясняет: проверяем логин/пароль до docker login
      # и заодно говорим, если сам реестр недоступен раннеру (порт или сертификат)
      - name: Логин и пароль к реестру заданы?
        env:
          REG_HOST: ${{ vars.REGISTRY || 'docker.sonoma.su' }}
          REG_USER: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          REG_PASSWORD_SET: ${{ secrets.REGISTRY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          miss=""
          [ -n "$REG_USER" ] || miss="$miss REGISTRY_USERNAME (переменная или секрет с таким именем)"
          [ "$REG_PASSWORD_SET" = "true" ] || miss="$miss REGISTRY_PASSWORD (секрет)"
          if [ -n "$miss" ]; then
            echo "::error::для реестра $REG_HOST не задано:${miss}. Settings → Secrets and variables → Actions"
            exit 1
          fi
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' "https://$REG_HOST/v2/" || echo 000)
          case "$code" in
            200|401|403) echo "реестр $REG_HOST отвечает (/v2/ -> $code)" ;;
            *) echo "::warning::$REG_HOST/v2/ не отвечает (код $code): docker login может упасть — проверь порт 443 и что сертификат выдан публичным CA, а не самоподписанным" ;;
          esac

      - uses: docker/setup-buildx-action@v4

      - name: Вход в реестр
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY || 'docker.sonoma.su' }}
          username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Метки образов
        id: meta
        env:
          REGISTRY: ${{ vars.REGISTRY || 'docker.sonoma.su' }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'medusa' }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: XRAY_IMAGE=${{ env.XRAY_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что выложено
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Тег и релиз GitHub
    needs: [version, images]
    # !cancelled(): релиз и тег нужны даже тогда, когда публикация образов не удалась
    # (например, не задан секрет реестра). Иначе «merge в main есть, а релиза нет».
    if: ${{ !cancelled() && needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY || 'docker.sonoma.su' }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'medusa' }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      XRAY_IMAGE: ghcr.io/xtls/xray-core:26.9.9
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Завести тег v${{ env.VERSION }}
        if: needs.version.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

      # текст релиза собирается в файле: так в нём живёт и предупреждение о том, что
      # образы не выложились, и команды запуска — без длинных выражений внутри YAML
      - name: Собрать текст релиза
        run: |
          set -euo pipefail
          {
            if [ "${{ needs.images.result }}" != "success" ]; then
              echo "⚠ **Образы не выложены**: джоб публикации образов завершился со статусом \`${{ needs.images.result }}\`. Тег и релиз при этом на месте — причину смотри в шагах «Логин и пароль к реестру заданы?» и «Вход в реестр»."
              echo
            fi
            echo "## Образы: \`$REGISTRY/$REGISTRY_NAMESPACE\`"
            echo
            echo "Реестр закрытый, поэтому сначала вход по логину и паролю:"
            echo
            echo '```bash'
            echo "docker login $REGISTRY"
            echo
            echo "# панель"
            echo 'docker run -d --name medusa-panel --restart unless-stopped \'
            echo '  -p 8000:8000 -v medusa-panel:/data \'
            echo '  -e MEDUSA_ADMIN_USER=admin \'
            echo "  $REGISTRY/$REGISTRY_NAMESPACE/panel:$VERSION"
            echo "docker logs medusa-panel     # панель напечатает пароль владельца"
            echo
            echo "# нода (ей нужен host-сеть: API-порт и порты Xray)"
            echo 'docker run -d --name medusa-node --restart unless-stopped \'
            echo '  --network host \'
            echo '  -v medusa-node:/var/lib/medusa-node \'
            echo '  -e MEDUSA_NODE_PORT=9443 \'
            echo "  $REGISTRY/$REGISTRY_NAMESPACE/node:$VERSION"
            echo "docker logs medusa-node      # нода напечатает свой API-ключ: взять его в панель"
            echo '```'
            echo
            echo "Внутрь образа ноды положен \`$XRAY_IMAGE\`."
          } > release-body.md
          cat release-body.md

      - name: Релиз ${{ env.TAG }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Medusa ${{ env.VERSION }}
          generate_release_notes: true
          append_body: true
          body_path: release-body.md
